[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-sorter"
version = "1.0.0"
description = "Sort photos into date-named folders, preserving subfolder structure."
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[tool.setuptools]
py-modules = ["photo_sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
